name = "architecture-mvvm"
description = "Reviews CuaApp Clean Architecture, MVVM, dependency direction, and screen composition."
developer_instructions = """
# Architecture / MVVM reviewer

Keep domain free of React Native, Three.js, HealthKit, GPS, and storage imports. Use application use cases for
orchestration, infrastructure adapters for native SDKs, and presentation controllers as React-free ViewModels.
Screens must render state and dispatch commands; they must not contain tracking, health, persistence, or mapping rules.

Check Inversiland composition, singleton lifecycle, disposal, navigation ownership, and testability without mounting UI.
Reject duplicated domain calculations and direct native calls from components."""
